name: build

on:
  push:
    branches: [main, firmware-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp8266, esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.env }}
        env:
          FRY_API_TOKEN: ${{ secrets.FRY_API_TOKEN }}
        run: pio run -e ${{ matrix.env }}

      - name: Name the artifact
        run: |
          set -eu
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "firmware-${{ matrix.env }}.bin"
          # The ESP32 family needs its bootloader and partition table downstream:
          # firmware.bin is an app-only image for offset 0x10000, so the release job
          # merges a factory image a browser flasher can write from offset 0x0.
          for extra in bootloader partitions; do
            if [ -f ".pio/build/${{ matrix.env }}/$extra.bin" ]; then
              cp ".pio/build/${{ matrix.env }}/$extra.bin" "$extra-${{ matrix.env }}.bin"
            fi
          done

      - name: Merge factory image
        # Must happen HERE, not in the release job: the release job never runs `pio run`, so
        # ~/.platformio/packages is empty there and boot_app0.bin does not exist. Merging in
        # the build job and shipping the result as an artifact is the only place both esptool
        # and the Arduino framework are guaranteed present.
        if: matrix.env != 'esp8266'
        run: |
          set -eu
          python3 tools/make_manifest.py --version 0.0.0-ci --release-base . \
            --build-dir .pio/build --dist . --out /tmp/ci-manifest.json --python python3 \
            --only ${{ matrix.env }}
          ls -l firmware-${{ matrix.env }}-factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware-${{ matrix.env }}.bin
            bootloader-${{ matrix.env }}.bin
            partitions-${{ matrix.env }}.bin
            firmware-${{ matrix.env }}-factory.bin
          if-no-files-found: error

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run Unity suite (native)
        run: pio test -e native

  release:
    needs: [build, test-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release binaries and the manifest input layout
        run: |
          set -eu
          mkdir -p release
          for env in esp8266 esp32 esp32s3 esp32c3; do
            mkdir -p "manifest_input/$env"
            cp "artifacts/firmware-$env/firmware-$env.bin" "release/firmware-$env.bin"
            cp "artifacts/firmware-$env/firmware-$env.bin" "manifest_input/$env/firmware.bin"
            for extra in bootloader partitions; do
              src="artifacts/firmware-$env/$extra-$env.bin"
              if [ -f "$src" ]; then cp "$src" "manifest_input/$env/$extra.bin"; fi
            done
            fac="artifacts/firmware-$env/firmware-$env-factory.bin"
            if [ -f "$fac" ]; then cp "$fac" "release/firmware-$env-factory.bin"; fi
          done

      - name: Generate ota/manifest.json
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/make_manifest.py --version "$VERSION" \
            --release-base "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            --build-dir manifest_input --out ota/manifest.json --dist release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/firmware-esp8266.bin
            release/firmware-esp32.bin
            release/firmware-esp32s3.bin
            release/firmware-esp32c3.bin
            release/firmware-esp32-factory.bin
            release/firmware-esp32s3-factory.bin
            release/firmware-esp32c3-factory.bin
            ota/manifest.json

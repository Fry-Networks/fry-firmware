name: test-channel

# Publishes the *_test envs to the fixed `ota-test` PRERELEASE (PROTOCOL.md section 11.5). Only
# boards running a *_test image read that manifest, and firmware 0.4+ refuses a manifest whose
# "channel" is not its own, so nothing here can reach a field board. Refuses to run unless
# ota-test already exists as a prerelease. Images are built with no bootstrap token and checked.

on:
  workflow_dispatch:
    inputs:
      fault:
        description: "FRY_TEST_FAULT for the ESP32-family images (0 = none; 1 abort after banner, 2 never heartbeat, 3 crash 60 s after heartbeat)"
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: ota-test must be a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=$(gh release view ota-test --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)
          if [ "$pre" != "true" ]; then
            echo "::error::ota-test is not a prerelease (isPrerelease=$pre) - refusing to publish"
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [esp8266_test, esp32_test, esp32s3_test, esp32c3_test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build ${{ matrix.env }} (token-free)
        env:
          FAULT: ${{ inputs.fault }}
        run: |
          set -eu
          # ESP8266 has one slot and cannot roll a fault back; tools/fry_prebuild.py refuses it there.
          if [ "$FAULT" != "0" ] && [ "${{ matrix.env }}" != "esp8266_test" ]; then
            export FRY_TEST_FAULT="$FAULT"
          fi
          pio run -e ${{ matrix.env }}

      - name: No token compiled in
        run: python3 tools/check_no_token.py

      - name: Name the artifact
        run: |
          set -eu
          base="${{ matrix.env }}"
          base="${base%_test}"
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "firmware-$base.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: fwtest-${{ matrix.env }}
          path: firmware-*.bin
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the test images
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate the test-channel manifest
        run: |
          set -eu
          VERSION=$(python3 -c "import re; print(re.search(r\"FRY_FIRMWARE_VERSION='\\\"([^\\\"]+)\\\"'\", open('platformio.ini').read()).group(1))")
          mkdir -p release
          for env in esp8266 esp32 esp32s3 esp32c3; do
            mkdir -p "manifest_input/$env"
            cp "artifacts/fwtest-${env}_test/firmware-$env.bin" "manifest_input/$env/firmware.bin"
          done
          python3 tools/make_manifest.py --version "$VERSION" --channel test --no-factory \
            --release-base "https://github.com/${{ github.repository }}/releases/download/ota-test" \
            --build-dir manifest_input --out ota/manifest.json --dist release
          cat ota/manifest.json

      - name: Upload to the ota-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=$(gh release view ota-test --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease)
          if [ "$pre" != "true" ]; then
            echo "::error::ota-test stopped being a prerelease - refusing to upload"
            exit 1
          fi
          gh release upload ota-test --repo "${{ github.repository }}" --clobber \
            release/firmware-esp8266.bin release/firmware-esp32.bin \
            release/firmware-esp32s3.bin release/firmware-esp32c3.bin ota/manifest.json

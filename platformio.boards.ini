; Board-support environments (RP2040/RP2350/BK7231N). Pulled in by [platformio] extra_configs in platformio.ini.
; Owned by the boards track.
;
; New platforms are new files behind the existing chip-agnostic src/core headers (wifi_station.h, provisioning_transport.h,
; vpn_relay.h, http_tls.h, kv_store.h, ota_client.h). Each env compiles
;   src/boards/**        the miner shared by the three boards (setup/loop, Wi-Fi station, SoftAP portal, OTA, TLS roots)
;   src/hal/**           fry::board::BoardHal and fry::cfg::Store
;   src/rp2040/** | src/bk7231n/**   what differs per platform (KV backend, HTTPS client, OTA writer)
; and only those src/core files that build unchanged against the shim headers in src/boards/shim (fry_config, miner_key,
; hardwareapi_client, telemetry, status_snapshot, improv_serial_glue, trigger_stubs, heap_gate_wait). The ESP-coupled ones
; (ota_client, main, serial_commands, the olostep files, every src/esp32 and src/esp8266 file) are not compiled here.

[env:native_boards]
platform = native
test_framework = unity
lib_deps = ${embedded.lib_deps}
test_filter = test_boards_*

[boardscommon]
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.3
; lib/fry_core and lib/fry_ui are compiled from build_src_filter instead of by the library finder, so that heap_gate.cpp (which
; calls the ESP-named ESP.getMaxAllocHeap()) can be built through its wrap_heap_gate.cpp translation unit.
lib_ignore = fry_core, fry_ui
extra_scripts = pre:tools/fry_prebuild.py
build_flags =
  -DFRY_FIRMWARE_VERSION='"0.4.31"'
  -DFRY_MINER_CODE='"IOTVPN"'
  -DFRY_KEY_MODEL=1
  -DHARDWAREAPI_BASE='"https://hardwareapi.frynetworks.com"'
  -DOTA_MANIFEST_URL='"https://github.com/Fry-Networks/fry-firmware/releases/latest/download/manifest.json"'
  -DFRY_HAS_IMPROV=1
  -DIMPROV_DEVICE_URL_BASE='"https://dashboard.frynetworks.com/new_registration"'
  -DFRY_BOARDS_PORT=1
  -Isrc/boards/shim
  -Ilib/fry_core
  -Ilib/fry_ui
  -Wno-unused-parameter

[pico_common]
extends = boardscommon
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#715eb70e666c45c84ce449daf3e970436c38efce
board_build.core = earlephilhower
board_build.filesystem = littlefs
; The OTA image is staged in LittleFS (arduino-pico Updater), so the filesystem must hold a whole image (~0.5 MB) beside the KV files.
board_build.filesystem_size = 1m
; The library finder pulls iLabs_Hearth in through a header name the WiFi stack shares; it needs a board with an ESP32-C6 co-processor.
lib_ignore = fry_core, fry_ui, iLabs Hearth
build_flags = ${boardscommon.build_flags} -DFRY_BOARD_PICO=1 -Isrc/rp2040/shim -Os
; Files of src/core that compile unchanged against the shims: fry_config, miner_key, status_snapshot,
; trigger_stubs directly; hardwareapi_client, telemetry, heap_gate_wait (and lib heap_gate) through src/boards/wrap_*.cpp and
; improv_serial_glue through src/rp2040/wrap_improv_serial_glue.cpp.
build_src_filter =
  -<*>
  +<core/fry_config.cpp>
  +<core/miner_key.cpp>
  +<core/status_snapshot.cpp>
  +<core/trigger_stubs.cpp>
  +<boards/>
  +<hal/>
  +<../lib/fry_core/*.cpp>
  -<../lib/fry_core/heap_gate.cpp>
  +<../lib/fry_ui/config_snapshot.cpp>
  +<rp2040/>

[env:rpipicow]
extends = pico_common
board = rpipicow
build_flags = ${pico_common.build_flags} -DFRY_BOARD_RPIPICOW -DFRY_CHIP='"RP2040"' -DFRY_BUILD_ENV='"rp2040"'

[env:rpipico2w]
extends = pico_common
board = rpipico2w
build_flags = ${pico_common.build_flags} -DFRY_BOARD_RPIPICO2W -DFRY_CHIP='"RP2350"' -DFRY_BUILD_ENV='"rp2350"'

[env:bk7231n]
extends = boardscommon
platform = libretiny@1.14.0
board = generic-bk7231n-qfn32-tuya
build_flags = ${boardscommon.build_flags} -DFRY_BOARD_BK7231N -DFRY_CHIP='"BK7231N"' -DFRY_BUILD_ENV='"bk7231n"' -Isrc/bk7231n/shim -Wp,-include,src/bk7231n/shim/Preferences.h -Wl,-u,__wrap_gettimeofday
build_src_filter =
  -<*>
  +<core/fry_config.cpp>
  +<core/miner_key.cpp>
  +<core/status_snapshot.cpp>
  +<core/improv_serial_glue.cpp>
  +<core/trigger_stubs.cpp>
  +<boards/>
  +<hal/>
  +<../lib/fry_core/*.cpp>
  -<../lib/fry_core/heap_gate.cpp>
  +<../lib/fry_ui/config_snapshot.cpp>
  +<bk7231n/>

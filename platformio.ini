[platformio]
default_envs = esp32
src_dir = src
lib_dir = lib

[env]
monitor_speed = 115200

[embedded]
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DFRY_FIRMWARE_VERSION='"0.2.0"'
  -DFRY_MINER_CODE='"IOTVPN"'
  -DHARDWAREAPI_BASE='"https://hardwareapi.frynetworks.com"'
  -DOTA_MANIFEST_URL='"https://github.com/Fry-Networks/fry-firmware/releases/latest/download/manifest.json"'
extra_scripts = pre:tools/fry_prebuild.py

[esp32common]
extends = embedded
platform = espressif32@6.12.0
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
; Mozilla root CA bundle for WiFiClientSecure::setCACertBundle() (src/esp32/http_tls.cpp) — see
; data/cert/gen_crt_bundle.py for how it's generated/verified. Inherited by every ESP32-family
; env (esp32, esp32s3, esp32c3, and esp32_lab which extends env:esp32).
board_build.embed_files = data/cert/x509_crt_bundle.bin
lib_deps =
  ${embedded.lib_deps}
  h2zero/NimBLE-Arduino@^2.3.0
  droscy/esp_wireguard@^0.4.5
build_flags = ${embedded.build_flags} -DFRY_HAS_BLE=1 -DFRY_HAS_WIREGUARD=1 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; loopTask runs the OTA manifest check, and mbedtls certificate-bundle verification
; (setCACertBundle, added in v0.2.0) needs materially more stack than the arduino-esp32
; default of 8192. Measured: with the default the board boot-looped on
;   Guru Meditation Error: Core 1 panic'ed (Unhandled debug exception)
;   Debug exception reason: Stack canary watchpoint triggered (loopTask)
; immediately after socks5 came up, i.e. on the first https manifest fetch.
  -DARDUINO_LOOP_STACK_SIZE=16384
; PlatformIO compiles every .cpp under src_dir for every env regardless of #ifdef guards (the
; LDF only gates lib/, never src/) — without this filter, src/esp8266/*.cpp (ESP8266WiFi.h,
; no-Preferences LittleFS store) would be pulled into every ESP32-family build and vice versa.
build_src_filter = +<*> -<esp8266/>

[env:esp32]
extends = esp32common
board = esp32dev
build_flags = ${esp32common.build_flags} -DFRY_BOARD_ESP32 -DFRY_CHIP='"ESP32"' -DFRY_BUILD_ENV='"esp32"'
test_filter = test_provisioning

[env:esp32s3]
extends = esp32common
board = esp32-s3-devkitc-1
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=0
build_flags = ${esp32common.build_flags} -DFRY_BOARD_ESP32S3 -DFRY_CHIP='"ESP32-S3"' -DFRY_BUILD_ENV='"esp32s3"' -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = esp32common
board = esp32-c3-devkitm-1
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=0
; C3 has no USB-OTG peripheral (TinyUSB), only the lightweight USB-Serial-JTAG controller
; (HWCDC) - arduino-esp32's HWCDC.h only declares the `Serial` global when ARDUINO_USB_MODE=1
; *in addition to* ARDUINO_USB_CDC_ON_BOOT=1. Without it, neither the HWCDC nor the TinyUSB
; path declares Serial and every Serial.* call fails to compile (verified on-target here).
build_flags = ${esp32common.build_flags} -DFRY_BOARD_ESP32C3 -DFRY_CHIP='"ESP32-C3"' -DFRY_BUILD_ENV='"esp32c3"' -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:esp8266]
extends = embedded
platform = espressif8266@4.2.1
board = nodemcuv2
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_filters = esp8266_exception_decoder
build_unflags = -fexceptions
build_flags = ${embedded.build_flags} -DFRY_BOARD_ESP8266 -DFRY_CHIP='"ESP8266"' -DFRY_BUILD_ENV='"esp8266"' -DFRY_HAS_SOCKS5=1
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -D VTABLES_IN_FLASH
  -Os -ffunction-sections -fdata-sections -fno-exceptions -Wl,--gc-sections
build_src_filter = +<*> -<esp32/>

[env:esp32_lab]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DFRY_SERIAL_PROVISION=1 -DFRY_LAB=1

[env:esp8266_lab]
extends = env:esp8266
build_flags = ${env:esp8266.build_flags} -DFRY_SERIAL_PROVISION=1 -DFRY_LAB=1

[env:native]
platform = native
test_framework = unity
test_filter = test_provisioning

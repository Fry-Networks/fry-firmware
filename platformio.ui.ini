; Display / touch UI environments. Pulled in by [platformio] extra_configs in platformio.ini.
; Owned by the UI track (T-UI). The native test env, the new display-enabled firmware envs and the
; unified autodetect images live here; nothing in platformio.ini is changed.
;
; Library pins (exact versions, registry names verified in the toolchain recon):
;   olikraus/U8g2       2.36.18  mono OLED (SSD1306 / SH1106)
;   lovyan03/LovyanGFX  1.3.0    colour TFT + touch controllers
;   ricmoo/QRCode       0.0.1    "Setup with App" QR

[uilibs]
qr = ricmoo/QRCode@0.0.1
u8g2 = olikraus/U8g2@2.36.18
lgfx = lovyan03/LovyanGFX@1.3.0
; framework library, named explicitly because src/display includes it through a macro (see src/ui/fry_inc.h)
wire = Wire

[env:native_ui]
platform = native
test_framework = unity
lib_deps =
  ${embedded.lib_deps}
  ${uilibs.qr}
  ${uilibs.wire}
test_filter = test_ui_*, test_display_*
; QRCode's registry manifest is framework=arduino; the host build has no framework, so the soft compat
; check would drop it.
lib_compat_mode = off
build_flags = -Wall -Wextra -Wno-unused-parameter -std=gnu++11 -std=gnu11

; ---- display / touch firmware envs -----------------------------------------------------------------------------------
; Every env below is an existing prod env plus -DFRY_HAS_DISPLAY=1 (src/display + src/ui are empty units without it) and the
; drivers it needs. FRY_BUILD_ENV / FRY_CHIP are inherited UNCHANGED (OTA manifest key and the device-name grammar), so
; these are bench / opt-in images: they are not in the CI matrix or the OTA manifest, like env:esp32_wroom32.
; Boards: esp32 / esp32s3 take their pin map from a preset (lib/fry_ui/display_presets.cpp, -DFRY_UI_PRESET=n) or, in the
; unified "-ui" images (no FRY_UI_PRESET), from the bounded autodetect over candidate presets. display_mode in the config
; store (auto / none / screen / touch) overrides either; none = zero polling.

; ESP32 + SSD1306 OLED on I2C 21/22 (screen animation, no touch).
[env:esp32-oled]
extends = env:esp32
lib_deps = ${esp32common.lib_deps}
  ${uilibs.u8g2}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_U8G2=1 -DFRY_UI_PRESET=1

; ESP32-S3 + ST7789 SPI TFT (screen animation; preset 2 = no touch).
[env:esp32s3-tft]
extends = env:esp32s3
lib_deps = ${esp32common.lib_deps}
  ${uilibs.lgfx}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32s3.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_LGFX=1 -DFRY_UI_PRESET=2

; ESP32-2432S028R "CYD": ILI9341 240x320 + XPT2046 resistive touch.
[env:esp32-cyd-touch]
extends = env:esp32
lib_deps = ${esp32common.lib_deps}
  ${uilibs.lgfx}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_LGFX=1 -DFRY_UI_PRESET=4

; ESP32-S3 + SPI TFT + I2C capacitive touch (CST816S / FT6236 / GT911, detected at boot).
[env:esp32s3-cap-touch]
extends = env:esp32s3
lib_deps = ${esp32common.lib_deps}
  ${uilibs.lgfx}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32s3.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_LGFX=1 -DFRY_UI_PRESET=5

; Unified images: one binary per chip, display / touch autodetected at boot (NONE / SCREEN_ONLY / TOUCHSCREEN).
[env:esp32-ui]
extends = env:esp32
lib_deps = ${esp32common.lib_deps}
  ${uilibs.u8g2}
  ${uilibs.lgfx}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_U8G2=1 -DFRY_HAS_LGFX=1

[env:esp32s3-ui]
extends = env:esp32s3
lib_deps = ${esp32common.lib_deps}
  ${uilibs.u8g2}
  ${uilibs.lgfx}
  ${uilibs.qr}
  ${uilibs.wire}
build_flags = ${env:esp32s3.build_flags} -DFRY_HAS_DISPLAY=1 -DFRY_HAS_U8G2=1 -DFRY_HAS_LGFX=1

; Raspberry Pi Pico W + SSD1306 OLED (I2C0 GP4/GP5). The firmware core is not ported to RP2040 on this branch (the boards track
; owns src/rp2040), so this env builds the display bring-up image: FRY_UI_BARE = same probe / resolve / ScreenAnimator over a
; looping demo status, no src/core. Once the boards track lands, switch this env to extend its rpipicow env and drop FRY_UI_BARE.
; Platform pin: the develop sha recorded in recon/toolchain-recon.md (arduino-pico core 6.4.0).
[env:rpipicow-oled]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#715eb70e666c45c84ce449daf3e970436c38efce
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
monitor_speed = 115200
; FRY_SOFT_I2C: bit-banged I2C (no Wire): the core's own libraries are not reachable by this platform's library finder.
lib_deps =
  ${uilibs.u8g2}
  ${uilibs.qr}
; -std=gnu11: arm-none-eabi GCC 16 defaults C to C23 (bool is a keyword), which breaks ricmoo/QRCode's qrcode.h typedef.
build_flags = -std=gnu11 -DFRY_SOFT_I2C=1 -DFRY_HAS_DISPLAY=1 -DFRY_HAS_U8G2=1 -DFRY_UI_PRESET=3 -DFRY_UI_BARE=1 -DFRY_FIRMWARE_VERSION='"0.4.31"'
build_unflags = -std=gnu23
lib_ignore = fry_core, iLabs Hearth, WiFi, Updater
build_src_filter = -<*> +<display/> +<ui/>

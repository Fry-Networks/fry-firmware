; Display / touch UI environments. Pulled in by [platformio] extra_configs in platformio.ini.
; Owned by the UI track (T-UI). The native test env, the new display-enabled firmware envs and the
; unified autodetect images live here; nothing in platformio.ini is changed.
;
; Library pins (exact versions, registry names verified in the toolchain recon):
;   olikraus/U8g2       2.36.18  mono OLED (SSD1306 / SH1106)
;   lovyan03/LovyanGFX  1.3.0    colour TFT + touch controllers
;   ricmoo/QRCode       0.0.1    "Setup with App" QR

[uilibs]
qr = ricmoo/QRCode@0.0.1
u8g2 = olikraus/U8g2@2.36.18
lgfx = lovyan03/LovyanGFX@1.3.0
; framework library, named explicitly because src/display includes it through a macro (see src/ui/fry_inc.h)
wire = Wire

[env:native_ui]
platform = native
test_framework = unity
lib_deps =
  ${embedded.lib_deps}
  ${uilibs.qr}
  ${uilibs.wire}
test_filter = test_ui_*, test_display_*
; QRCode's registry manifest is framework=arduino; the host build has no framework, so the soft compat
; check would drop it.
lib_compat_mode = off
build_flags = -Wall -Wextra -Wno-unused-parameter -std=gnu++11 -std=gnu11

; ---- display / touch firmware envs -----------------------------------------------------------------------------------
; The DEFAULT env:esp32 and env:esp32s3 (platformio.ini) are the unified display / touch images: drivers compiled in, one
; binary per chip, FRY_BUILD_ENV unchanged so an OTA keeps the UI. The envs below are the same image plus a COMPILED-IN
; board preset (-DFRY_UI_PRESET=n, lib/fry_ui/display_presets.cpp): the preset enables the SPI / touch probe for that
; wiring, and the first boot copies it into the config store ("fry_ui"/dispPreset) so it survives an OTA to the default
; image. Without a preset (the default images, display_mode=Auto) only the bounded I2C probe on the default I2C pins runs.
; display_mode in the config store (auto / none / screen / touch) overrides; none = zero polling.

; ESP32 + SSD1306 OLED on I2C 21/22 (screen animation, no touch).
[env:esp32-oled]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DFRY_UI_PRESET=1

; ESP32-S3 + ST7789 SPI TFT (screen animation; preset 2 = no touch).
[env:esp32s3-tft]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DFRY_UI_PRESET=2

; ESP32-2432S028R "CYD": ILI9341 240x320 + XPT2046 resistive touch.
[env:esp32-cyd-touch]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DFRY_UI_PRESET=4

; ESP32-S3 + SPI TFT + I2C capacitive touch (CST816S / FT6236 / GT911, detected at boot).
[env:esp32s3-cap-touch]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DFRY_UI_PRESET=5

; Unified images under their historical names: now identical to env:esp32 / env:esp32s3.
[env:esp32-ui]
extends = env:esp32

[env:esp32s3-ui]
extends = env:esp32s3

; Raspberry Pi Pico W + SSD1306 OLED (I2C0 GP4/GP5): the REAL miner of env:rpipicow (boards track) plus the display. fry_ui_setup /
; fry_ui_loop are called from src/boards/main_boards.cpp; the probe is the I2C-only default (preset 3 is compiled in, so the OLED
; wiring is declared) and a found OLED runs the SCREEN_ONLY animator over the live miner status (src/ui/ui_glue.cpp).
; fry::cfg::deviceStore() stays owned by src/hal/config_store_boards.cpp (ui_glue defers to it on a board port).
; FRY_SOFT_I2C: bit-banged I2C (no Wire): the core's own libraries are not reachable by this platform's library finder.
; -std=gnu11: arm-none-eabi GCC 16 defaults C to C23 (bool is a keyword), which breaks ricmoo/QRCode's qrcode.h typedef.
[env:rpipicow-oled]
extends = env:rpipicow
lib_deps =
  ${boardscommon.lib_deps}
  ${uilibs.u8g2}
  ${uilibs.qr}
build_flags = ${env:rpipicow.build_flags} -std=gnu11 -DFRY_SOFT_I2C=1 -DFRY_HAS_DISPLAY=1 -DFRY_HAS_U8G2=1 -DFRY_UI_PRESET=3
build_unflags = -std=gnu23
build_src_filter =
  ${env:rpipicow.build_src_filter}
  -<../lib/fry_ui/config_snapshot.cpp>
  +<display/>
  +<ui/>
